[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup"
version = "0.1.0"
description = "International football EDA and 2026 World Cup forecasting"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "polars>=1.0", "pyarrow>=15.0",
                "numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
